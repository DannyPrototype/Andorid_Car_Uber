name: Build Modo Constructor APK

on:
  push:
    branches:
      - build/modo-constructor-apk-20260908
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: modo-constructor-app
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp modo-constructor-app/app/build/outputs/apk/debug/app-debug.apk ModoConstructor.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModoConstructor-APK
          path: ModoConstructor.apk
          if-no-files-found: error
